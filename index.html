<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJJRA NFT Minter</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 5px 20px #0002;
}
h1 {
    text-align: center;
}
input, textarea, button {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
}
button {
    background: #111;
    color: white;
    font-size: 16px;
    border: none;
    cursor: pointer;
}
button:disabled {
    background: #999;
}
#status {
    margin-top: 15px;
    padding: 12px;
    background: #f1f1f1;
    border-radius: 10px;
    word-break: break-word;
}
</style>
</head>

<body>

<div class="container">

<h1>AJJRA NFT</h1>

<p><b>MST Blockchain NFT Mint</b></p>
<p>Mint Fee: <b>1 USDC.e</b></p>

<button onclick="connectWallet()">
Connect Wallet
</button>

<p id="wallet">Wallet not connected</p>

<input
type="text"
id="name"
placeholder="NFT Name">

<textarea
id="description"
placeholder="NFT Description"></textarea>

<input
type="text"
id="imageURI"
placeholder="IPFS Image URI">

<button onclick="mintNFT()" id="mintButton" disabled>
Approve 1 USDC + Mint NFT
</button>

<div id="status">
Status: Waiting for wallet...
</div>

</div>

<script>

const MST_CHAIN_ID = 4646;

const USDC =
"0x349d9836dd52c25e61Ae745e3da0F8989De63745";

const FEE_WALLET =
"0x58A355040D211e0dB4140E98eE6619207f43e934";

/*
IMPORTANT:
After deploying your NFT smart contract,
replace this address.
*/
const NFT_CONTRACT =
"0xYOUR_NFT_CONTRACT_ADDRESS";


const NFT_ABI = [

"function mint(string memory tokenURI) external",

"function mintFee() external view returns(uint256)"

];


const ERC20_ABI = [

"function approve(address spender,uint256 amount) external returns(bool)",

"function allowance(address owner,address spender) external view returns(uint256)",

"function transfer(address to,uint256 amount) external returns(bool)"

];


let provider;
let signer;
let userAddress;


async function connectWallet() {

    if (!window.ethereum) {

        alert("Please install MetaMask or another Web3 wallet.");

        return;
    }

    try {

        provider =
            new ethers.BrowserProvider(window.ethereum);

        signer =
            await provider.getSigner();

        userAddress =
            await signer.getAddress();

        const network =
            await provider.getNetwork();

        if (Number(network.chainId) !== MST_CHAIN_ID) {

            alert(
                "Please switch your wallet to MST Mainnet."
            );

            return;
        }

        document.getElementById("wallet").innerText =
            "Connected: " + userAddress;

        document.getElementById("mintButton")
            .disabled = false;

        document.getElementById("status").innerText =
            "Wallet connected.";

    }

    catch(error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Wallet connection failed.";

    }
}


async function mintNFT() {

    try {

        const name =
            document.getElementById("name").value;

        const description =
            document.getElementById("description").value;

        const imageURI =
            document.getElementById("imageURI").value;


        if (!name || !description || !imageURI) {

            alert(
                "Please enter NFT name, description and IPFS image URI."
            );

            return;
        }


        document.getElementById("status").innerText =
            "Preparing 1 USDC payment...";


        const usdc =
            new ethers.Contract(
                USDC,
                ERC20_ABI,
                signer
            );


        /*
        USDC.e normally uses 6 decimals.
        1 USDC = 1,000,000 units.
        */

        const fee =
            ethers.parseUnits("1", 6);


        /*
        Approve NFT contract to receive 1 USDC
        */

        document.getElementById("status").innerText =
            "Approve 1 USDC in your wallet...";


        const approveTx =
            await usdc.approve(
                NFT_CONTRACT,
                fee
            );

        await approveTx.wait();


        /*
        Metadata URI
        */

        const metadataURI =
            imageURI;


        const nft =
            new ethers.Contract(
                NFT_CONTRACT,
                NFT_ABI,
                signer
            );


        document.getElementById("status").innerText =
            "Minting NFT...";


        const mintTx =
            await nft.mint(metadataURI);


        await mintTx.wait();


        document.getElementById("status").innerHTML =
            "NFT Minted Successfully!<br><br>" +

            "Transaction:<br>" +

            "<a target='_blank' href='https://mstscan.com/tx/" +

            mintTx.hash +

            "'>" +

            mintTx.hash +

            "</a>";

    }

    catch(error) {

        console.error(error);

        document.getElementById("status").innerText =
            "Transaction failed: " +
            (error.reason || error.message);

    }

}

</script>

</body>
</html>
