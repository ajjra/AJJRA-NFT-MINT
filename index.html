<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AJJRA NFT MINT</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top,#124d3b,#06100d 45%,#020504);
color:white;
min-height:100vh;
}

header{
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #24453b;
background:#06100de8;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:20px;
font-weight:bold;
}

.logo span{
color:#42e6a2;
}

button{
cursor:pointer;
border:none;
}

.connect{
background:#10261e;
color:#42e6a2;
border:1px solid #42e6a2;
padding:11px 15px;
border-radius:12px;
font-weight:bold;
}

.hero{
text-align:center;
padding:55px 20px 30px;
}

.badge{
display:inline-block;
padding:8px 14px;
border:1px solid #286c55;
border-radius:30px;
color:#42e6a2;
font-size:12px;
margin-bottom:18px;
}

.hero h1{
font-size:40px;
margin-bottom:15px;
}

.hero h1 span{
color:#42e6a2;
}

.hero p{
color:#9db2aa;
line-height:1.6;
max-width:520px;
margin:auto;
}

.container{
width:92%;
max-width:680px;
margin:auto;
padding-bottom:50px;
}

.card{
background:#ffffff0d;
border:1px solid #ffffff16;
border-radius:22px;
padding:22px;
margin-bottom:18px;
backdrop-filter:blur(15px);
box-shadow:0 15px 40px #0005;
}

.card h2{
margin-bottom:20px;
}

label{
display:block;
margin:14px 0 7px;
color:#b7c9c2;
font-size:14px;
}

input,textarea{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ffffff1c;
background:#06100d;
color:white;
outline:none;
}

textarea{
min-height:100px;
}

input:focus,
textarea:focus{
border-color:#42e6a2;
}

.fee{
margin:20px 0;
padding:17px;
display:flex;
justify-content:space-between;
background:#42e6a20d;
border:1px solid #42e6a233;
border-radius:14px;
}

.fee strong{
color:#42e6a2;
font-size:20px;
}

.approve,
.mint{
width:100%;
padding:15px;
border-radius:13px;
font-weight:bold;
font-size:16px;
margin-top:10px;
}

.approve{
background:#182e27;
color:#42e6a2;
border:1px solid #42e6a2;
}

.mint{
background:linear-gradient(135deg,#42e6a2,#16966b);
color:#03100b;
}

.status{
margin-top:15px;
color:#42e6a2;
word-break:break-word;
line-height:1.5;
}

.wallet{
font-size:13px;
color:#9eb1aa;
word-break:break-all;
}

.nft{
padding:15px;
margin-top:12px;
border-radius:13px;
background:#07150f;
border:1px solid #ffffff10;
}

footer{
text-align:center;
color:#61746c;
padding:25px;
font-size:12px;
}

</style>

</head>


<body>


<header>

<div class="logo">
AJJRA <span>NFT MINT</span>
</div>

<button
class="connect"
onclick="connectWallet()">

🔗 Connect Wallet

</button>

</header>


<section class="hero">

<div class="badge">
MSTC BLOCKCHAIN
</div>

<h1>
Create & <span>Mint</span>
</h1>

<p>
Create your digital NFT and record it
on the MSTC blockchain.
</p>

</section>


<div class="container">


<div class="card">

<h2>🔗 Wallet</h2>

<div
class="wallet"
id="wallet">

Not connected

</div>

</div>


<div class="card">

<h2>🎨 Create NFT</h2>


<label>NFT Name</label>

<input
id="nftName"
placeholder="My First NFT">


<label>Description</label>

<textarea
id="description"
placeholder="Describe your NFT...">
</textarea>


<label>Metadata URI</label>

<input
id="metadataURI"
placeholder="ipfs://...">


<div class="fee">

<span>AJJRA Service Fee</span>

<strong>1 USDC.e</strong>

</div>


<button
class="approve"
onclick="approveUSDC()">

1️⃣ Approve 1 USDC.e

</button>


<button
class="mint"
onclick="mintNFT()">

✦ MINT NFT

</button>


<div
class="status"
id="status">
</div>

</div>


<div class="card">

<h2>📦 My NFTs</h2>

<button
class="approve"
onclick="loadNFTs()">

Load My NFTs

</button>

<div id="nftList"></div>

</div>


</div>


<footer>

AJJRA NFT MINT<br>
Powered by MSTC Blockchain

</footer>


<script>


const CONTRACT_ADDRESS =
"PASTE_YOUR_DEPLOYED_CONTRACT_ADDRESS";


const USDC_ADDRESS =
"0x349d9836dd52c25e61Ae745e3da0F8989De63745";


const FEE_WALLET =
"0x58A355040D211e0dB4140E98eE6619207f43e934";


const USDC_ABI = [

"function approve(address,uint256) returns (bool)",

"function allowance(address,address) view returns (uint256)"

];


const NFT_ABI = [

"function mintNFT(string,string,string) returns (uint256)",

"function getMyNFTs() view returns (uint256[])",

"function getNFT(uint256) view returns (uint256,address,string,string,string,uint256)"

];


let provider;

let signer;

let nftContract;

let usdcContract;

let walletAddress;


/* CONNECT */

async function connectWallet(){

if(!window.ethereum){

alert(
"MetaMask / compatible Web3 wallet install ചെയ്യുക."
);

return;

}

try{

provider =
new ethers.BrowserProvider(
window.ethereum
);

await provider.send(
"eth_requestAccounts",
[]
);

signer =
await provider.getSigner();

walletAddress =
await signer.getAddress();

nftContract =
new ethers.Contract(
CONTRACT_ADDRESS,
NFT_ABI,
signer
);

usdcContract =
new ethers.Contract(
USDC_ADDRESS,
USDC_ABI,
signer
);

document.getElementById(
"wallet"
).innerText =
walletAddress;

document.querySelector(
".connect"
).innerText =
"✓ Connected";

}catch(error){

showError(error);

}

}


/* APPROVE */

async function approveUSDC(){

if(!usdcContract){

alert(
"ആദ്യം Connect Wallet ചെയ്യുക."
);

return;

}

try{

setStatus(
"USDC.e approval wallet-ൽ confirm ചെയ്യുക..."
);

const amount =
ethers.parseUnits(
"1",
6
);

const tx =
await usdcContract.approve(
CONTRACT_ADDRESS,
amount
);

setStatus(
"Approval transaction: " +
tx.hash
);

await tx.wait();

setStatus(
"✅ 1 USDC.e approved. ഇനി MINT NFT അമർത്തുക."
);

}catch(error){

showError(error);

}

}


/* MINT */

async function mintNFT(){

if(!nftContract){

alert(
"ആദ്യം Connect Wallet ചെയ്യുക."
);

return;

}

const name =
document.getElementById(
"nftName"
).value.trim();

const description =
document.getElementById(
"description"
).value.trim();

const metadata =
document.getElementById(
"metadataURI"
).value.trim();

if(!name){

alert(
"NFT Name നൽകുക."
);

return;

}

try{

setStatus(
"NFT mint ചെയ്യാൻ wallet confirmation കാത്തിരിക്കുന്നു..."
);

const tx =
await nftContract.mintNFT(
name,
description,
metadata
);

setStatus(
"Transaction submitted: " +
tx.hash
);

const receipt =
await tx.wait();

setStatus(
"✅ NFT created!\nTX: " +
tx.hash
);

await loadNFTs();

}catch(error){

showError(error);

}

}


/* LOAD NFTS */

async function loadNFTs(){

if(!nftContract){

alert(
"Connect Wallet ചെയ്യുക."
);

return;

}

try{

const ids =
await nftContract.getMyNFTs();

const list =
document.getElementById(
"nftList"
);

list.innerHTML = "";

if(ids.length === 0){

list.innerHTML =
"<p style='margin-top:15px;color:#8da39a'>No NFTs yet.</p>";

return;

}

for(
const id of ids
){

const n =
await nftContract.getNFT(id);

const div =
document.createElement(
"div"
);

div.className =
"nft";

div.innerHTML = `

<strong>
NFT #${n[0]}
</strong>

<p>
Name: ${escapeHTML(n[2])}
</p>

<p>
Description:
${escapeHTML(n[3])}
</p>

<p style="word-break:break-all">
Metadata:
${escapeHTML(n[4])}
</p>

<p>
Owner:
${n[1]}
</p>

`;

list.appendChild(div);

}

}catch(error){

showError(error);

}

}


/* STATUS */

function setStatus(text){

document.getElementById(
"status"
).innerText =
text;

}


/* ERROR */

function showError(error){

console.error(error);

let message =
error?.shortMessage ||
error?.reason ||
error?.message ||
"Transaction failed";

setStatus(
"❌ " + message
);

}


/* HTML SAFETY */

function escapeHTML(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}

</script>


</body>

</html>
