<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJJRA NFT MINT</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#123d35 0,#07120f 42%,#030706 100%);
    color:white;
    min-height:100vh;
}

header{
    padding:22px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    position:sticky;
    top:0;
    background:rgba(3,7,6,.75);
    backdrop-filter:blur(15px);
    z-index:10;
}

.logo{
    font-size:21px;
    font-weight:800;
    letter-spacing:1px;
}

.logo span{
    color:#45e6a4;
}

.connect{
    border:1px solid #45e6a4;
    background:rgba(69,230,164,.08);
    color:#45e6a4;
    padding:11px 16px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
}

.hero{
    text-align:center;
    padding:60px 20px 35px;
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:30px;
    background:rgba(69,230,164,.1);
    color:#45e6a4;
    border:1px solid rgba(69,230,164,.25);
    font-size:13px;
    margin-bottom:20px;
}

.hero h1{
    font-size:42px;
    line-height:1.05;
    margin-bottom:15px;
}

.hero h1 span{
    color:#45e6a4;
}

.hero p{
    color:#a7b6b1;
    max-width:550px;
    margin:auto;
    line-height:1.6;
}

.container{
    width:92%;
    max-width:700px;
    margin:auto;
    padding-bottom:50px;
}

.card{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    border-radius:24px;
    padding:24px;
    margin-bottom:20px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    backdrop-filter:blur(15px);
}

.card h2{
    margin-bottom:20px;
}

label{
    display:block;
    color:#b8c8c2;
    font-size:14px;
    margin:15px 0 8px;
}

input,textarea,select{
    width:100%;
    padding:14px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.12);
    background:#07100d;
    color:white;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#45e6a4;
}

.upload{
    border:1px dashed #397d68;
    padding:25px;
    text-align:center;
    border-radius:15px;
    color:#8fa59e;
}

.upload input{
    margin-top:15px;
}

.fee{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:20px 0;
    padding:16px;
    border-radius:15px;
    background:rgba(69,230,164,.08);
    border:1px solid rgba(69,230,164,.15);
}

.fee strong{
    color:#45e6a4;
    font-size:20px;
}

.mint{
    width:100%;
    padding:16px;
    border:none;
    border-radius:15px;
    background:linear-gradient(135deg,#45e6a4,#16a879);
    color:#03100b;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(69,230,164,.2);
}

.mint:hover{
    transform:translateY(-2px);
}

.menu{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.menu button{
    padding:15px;
    border-radius:14px;
    background:#091510;
    border:1px solid rgba(255,255,255,.08);
    color:#dce9e4;
    cursor:pointer;
}

.status{
    margin-top:15px;
    color:#45e6a4;
    font-size:14px;
    word-break:break-word;
}

footer{
    text-align:center;
    color:#65756f;
    padding:30px 20px;
    font-size:13px;
}

@media(max-width:500px){

    .hero h1{
        font-size:34px;
    }

    header{
        padding:16px;
    }

    .logo{
        font-size:18px;
    }

    .connect{
        padding:9px 11px;
        font-size:12px;
    }

    .card{
        padding:18px;
        border-radius:19px;
    }
}

</style>
</head>

<body>

<header>

<div class="logo">
AJJRA <span>NFT</span>
</div>

<button class="connect" onclick="connectWallet()">
🔗 Connect Wallet
</button>

</header>


<section class="hero">

<div class="badge">
⚡ MSTC BLOCKCHAIN
</div>

<h1>
Create Your
<span>NFT</span>
</h1>

<p>
Mint, manage and verify your digital assets
on the MSTC blockchain with AJJRA NFT MINT.
</p>

</section>


<div class="container">


<div class="card">

<h2>🎨 Create NFT</h2>


<label>NFT Name</label>

<input
id="nftName"
placeholder="My First NFT"
>


<label>Description</label>

<textarea
id="description"
placeholder="Describe your NFT..."
></textarea>


<label>Image</label>

<div class="upload">

📷 Upload NFT Image

<input
type="file"
id="image"
accept="image/*"
>

</div>


<label>Metadata URI</label>

<input
id="metadata"
placeholder="ipfs://..."
>


<div class="fee">

<div>
Service Fee
</div>

<strong>
1 MSTC
</strong>

</div>


<button class="mint"
onclick="mintNFT()">

✦ MINT NFT

</button>


<div
class="status"
id="status">
</div>

</div>


<div class="card">

<h2>📦 My NFTs</h2>

<div class="menu">

<button onclick="showMessage('My NFTs')">
🎨 My NFTs
</button>

<button onclick="showMessage('Verify NFT')">
🔍 Verify NFT
</button>

<button onclick="showMessage('Pricing')">
💳 Pricing
</button>

<button onclick="showMessage('History')">
📜 History
</button>

</div>

</div>


<div class="card">

<h2>🔗 Wallet</h2>

<p
id="wallet"
style="color:#899a94">
Wallet not connected
</p>

</div>


</div>


<footer>

AJJRA NFT MINT<br>
Digital Assets • MSTC Blockchain

</footer>


<script>

let walletAddress = null;


async function connectWallet(){

    if(!window.ethereum){

        alert(
            "Please install a Web3 wallet such as MetaMask."
        );

        return;

    }

    try{

        const accounts =
        await window.ethereum.request({
            method:"eth_requestAccounts"
        });

        walletAddress =
        accounts[0];

        document.getElementById("wallet")
        .innerText =
        "Connected: " +
        walletAddress;

        document.querySelector(".connect")
        .innerText =
        "✓ Connected";

    }

    catch(error){

        console.log(error);

    }

}


function mintNFT(){

    const name =
    document.getElementById("nftName").value;

    const description =
    document.getElementById("description").value;

    if(!walletAddress){

        alert(
            "ആദ്യം Connect Wallet അമർത്തുക."
        );

        return;

    }

    if(!name){

        alert(
            "NFT Name നൽകുക."
        );

        return;

    }

    document.getElementById("status")
    .innerText =
    "NFT തയ്യാറാക്കുന്നു... MSTC blockchain connection അടുത്ത ഘട്ടത്തിൽ ചേർക്കും.";

}


function showMessage(message){

    document.getElementById("status")
    .innerText =
    message +
    " section will be connected in the next version.";

}

</script>

</body>
</html>
