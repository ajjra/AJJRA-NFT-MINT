<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AJJRA NFT</title>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
    radial-gradient(circle at top,#29245c,#090914 55%,#050509);
    color:white;
    padding:20px;
}

.app{
    max-width:480px;
    margin:auto;
}

.logo{
    text-align:center;
    padding:25px 0;
}

.logo h1{
    margin:0;
    font-size:34px;
    letter-spacing:2px;
}

.logo p{
    color:#aaa;
    margin-top:8px;
}

.card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.network{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.06);
    padding:12px 14px;
    border-radius:14px;
    margin-bottom:18px;
}

.dot{
    width:9px;
    height:9px;
    display:inline-block;
    border-radius:50%;
    background:#777;
    margin-right:7px;
}

input,textarea{
    width:100%;
    margin-top:12px;
    padding:15px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(0,0,0,.25);
    color:white;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:none;
}

input:focus,textarea:focus{
    border-color:#8d7cff;
}

button{
    width:100%;
    padding:15px;
    margin-top:14px;
    border:0;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.connect{
    background:linear-gradient(135deg,#7c5cff,#b05cff);
    color:white;
}

.mint{
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.wallet{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:rgba(0,0,0,.25);
    font-size:13px;
    word-break:break-all;
    color:#bbb;
}

.fee{
    text-align:center;
    margin:18px 0;
    font-size:20px;
}

.status{
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:#bbb;
    font-size:14px;
    word-break:break-word;
}

.status a{
    color:#6db7ff;
}

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="app">

<div class="logo">

<h1>AJJRA NFT</h1>

<p>Mint NFTs on MST Blockchain</p>

</div>

<div class="card">

<div class="network">

<span>
<span class="dot" id="networkDot"></span>
<span id="networkText">MST Mainnet</span>
</span>

<span>Chain 4646</span>

</div>

<button
class="connect"
id="connectButton"
onclick="connectWallet()">

🔗 Connect Wallet

</button>

<div
class="wallet"
id="wallet">

Wallet not connected

</div>

<div class="fee">

Mint Fee: <b>1 USDC.e</b>

</div>

<input
id="name"
type="text"
placeholder="NFT Name">

<textarea
id="description"
placeholder="NFT Description"></textarea>

<input
id="imageURI"
type="text"
placeholder="IPFS Image URI">

<button
class="mint"
id="mintButton"
onclick="mintNFT()"
disabled>

🚀 Mint NFT — 1 USDC

</button>

<div
class="status"
id="status">

Connect your wallet to continue.

</div>

</div>

<div class="footer">

AJJRA TECHNO HUB • MST Blockchain

</div>

</div>

<script>

/* =========================
   MST NETWORK
========================= */

const MST_CHAIN_ID = 4646;

const MST_CHAIN_HEX = "0x1226";

const MST_NETWORK = {

    chainId: MST_CHAIN_HEX,

    chainName: "MST Mainnet",

    nativeCurrency: {

        name: "MSTC",

        symbol: "MSTC",

        decimals: 18

    },

    rpcUrls: [
        "https://mariorpc.mstblockchain.com",
        "https://craftrpc.mstblockchain.com"
    ],

    blockExplorerUrls: [
        "https://mstscan.com"
    ]

};


/* =========================
   USDC.e
========================= */

const USDC =
"0x349d9836dd52c25e61Ae745e3da0F8989De63745";


/* =========================
   FEE WALLET
========================= */

const FEE_WALLET =
"0x58A355040D211e0dB4140E98eE6619207f43e934";


/* =========================
   NFT CONTRACT

   IMPORTANT:
   Deploy NFT contract first.
========================= */

const NFT_CONTRACT =
"0xYOUR_NFT_CONTRACT_ADDRESS";


const NFT_ABI = [

    "function mint(string memory tokenURI) external"

];


const ERC20_ABI = [

    "function approve(address spender,uint256 amount) external returns(bool)",

    "function allowance(address owner,address spender) external view returns(uint256)"

];


let provider = null;

let signer = null;

let userAddress = null;


/* =========================
   STATUS
========================= */

function status(message){

    document.getElementById("status").innerHTML =
        message;

}


/* =========================
   ADD / SWITCH MST
========================= */

async function switchToMST(){

    try{

        await window.ethereum.request({

            method:"wallet_switchEthereumChain",

            params:[
                {
                    chainId:MST_CHAIN_HEX
                }
            ]

        });

    }

    catch(error){

        /* Network does not exist */

        if(error.code === 4902){

            await window.ethereum.request({

                method:"wallet_addEthereumChain",

                params:[
                    MST_NETWORK
                ]

            });

        }

        else{

            throw error;

        }

    }

}


/* =========================
   CONNECT WALLET
========================= */

async function connectWallet(){

    if(!window.ethereum){

        status(
            "❌ Wallet not detected.<br><br>" +
            "Open this website inside MetaMask browser " +
            "or install a compatible Web3 wallet."
        );

        return;

    }

    try{

        status("Connecting wallet...");

        await window.ethereum.request({

            method:"eth_requestAccounts"

        });


        /* Switch MST */

        await switchToMST();


        /* Create provider */

        provider =
            new ethers.BrowserProvider(
                window.ethereum
            );


        signer =
            await provider.getSigner();


        userAddress =
            await signer.getAddress();


        const network =
            await provider.getNetwork();


        if(Number(network.chainId) !== MST_CHAIN_ID){

            status(
                "❌ Please switch to MST Mainnet."
            );

            return;

        }


        document.getElementById("wallet")
            .innerText =
            "Connected: " +
            userAddress;


        document.getElementById("connectButton")
            .innerText =
            "✅ Wallet Connected";


        document.getElementById("networkDot")
            .style.background =
            "#00ff88";


        document.getElementById("mintButton")
            .disabled = false;


        status(
            "✅ Wallet connected successfully.<br>" +
            "MST Mainnet is ready."
        );

    }

    catch(error){

        console.error(error);

        status(
            "❌ Wallet connection failed.<br><br>" +
            (error.shortMessage ||
             error.message ||
             "Unknown error")
        );

    }

}


/* =========================
   MINT NFT
========================= */

async function mintNFT(){

    if(!signer){

        alert("Connect wallet first.");

        return;

    }


    if(
        NFT_CONTRACT ===
        "0xYOUR_NFT_CONTRACT_ADDRESS"
    ){

        status(
            "⚠️ NFT smart contract address is not added yet."
        );

        return;

    }


    try{

        const name =
            document.getElementById("name").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const imageURI =
            document.getElementById("imageURI").value.trim();


        if(!name){

            alert("Enter NFT name.");

            return;

        }


        if(!description){

            alert("Enter NFT description.");

            return;

        }


        if(!imageURI){

            alert("Enter IPFS image URI.");

            return;

        }


        status(
            "⏳ Preparing 1 USDC.e payment..."
        );


        /*
          USDC.e = 6 decimals
          1 USDC = 1,000,000
        */

        const fee =
            ethers.parseUnits("1",6);


        const usdc =
            new ethers.Contract(

                USDC,

                ERC20_ABI,

                signer

            );


        status(
            "🔐 Please approve 1 USDC.e..."
        );


        const approveTx =
            await usdc.approve(

                NFT_CONTRACT,

                fee

            );


        await approveTx.wait();


        status(
            "⏳ Approval confirmed.<br>" +
            "Minting NFT..."
        );


        /*
          IMPORTANT:
          This requires your NFT contract
          to collect the USDC payment.
        */

        const nft =
            new ethers.Contract(

                NFT_CONTRACT,

                NFT_ABI,

                signer

            );


        const mintTx =
            await nft.mint(imageURI);


        status(
            "⏳ Waiting for blockchain confirmation..."
        );


        await mintTx.wait();


        status(

            "🎉 <b>NFT Minted Successfully!</b><br><br>" +

            "Transaction:<br>" +

            "<a target='_blank' href='https://mstscan.com/tx/" +

            mintTx.hash +

            "'>" +

            mintTx.hash +

            "</a>"

        );

    }

    catch(error){

        console.error(error);

        status(

            "❌ Transaction failed.<br><br>" +

            (
                error.shortMessage ||
                error.reason ||
                error.message ||
                "Unknown error"
            )

        );

    }

}


/* =========================
   WALLET EVENTS
========================= */

if(window.ethereum){

    window.ethereum.on(
        "accountsChanged",
        function(accounts){

            if(accounts.length === 0){

                location.reload();

            }
            else{

                connectWallet();

            }

        }
    );


    window.ethereum.on(
        "chainChanged",
        function(){

            location.reload();

        }
    );

}

</script>

</body>
</html>
